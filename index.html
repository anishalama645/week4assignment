```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive bubble tea image slider">
    <title>Bubble Tea Image Slider</title>
    <link rel="stylesheet" href="style.css">
    <script src="slider.js" defer></script>
</head>
<body>

    <header class="page-header">
        <h1>Bubble Tea Gallery</h1>
        <p>Explore our delicious bubble tea collection</p>
    </header>

    <main>
        <section class="slider-section" aria-label="Bubble tea image gallery">

            <div class="slider" id="imageSlider">

                <div class="slider-viewport">
                    <div class="slider-track" id="sliderTrack">

                        <!-- Image 1 -->
                        <div class="slide">
                            <img src="Images/image1.jpg"
                                 alt="A colorful collection of bubble tea drinks">
                        </div>

                        <!-- Image 2 -->
                        <div class="slide">
                            <img src="Images/image2.jpg"
                                 alt="Freshly prepared milk tea with tapioca pearls">
                        </div>

                        <!-- Image 3 -->
                        <div class="slide">
                            <img src="Images/image3.jpg"
                                 alt="Creamy milk tea served in a glass">
                        </div>

                    </div>
                </div>

                <!-- Previous and Next buttons -->
                <button class="slider-btn prev-btn"
                        id="prevBtn"
                        type="button"
                        aria-label="Previous image">
                    &#10094;
                </button>

                <button class="slider-btn next-btn"
                        id="nextBtn"
                        type="button"
                        aria-label="Next image">
                    &#10095;
                </button>

                <!-- Navigation dots are generated by JavaScript -->
                <div class="slider-dots"
                     id="sliderDots"
                     aria-label="Choose an image">
                </div>

            </div>

            <p class="slider-caption" id="sliderCaption" aria-live="polite">
                Image 1 of 3
            </p>

        </section>
    </main>

    <footer>
        <p>Image Slider Library | CSE 230 - Web Design and Development</p>
    </footer>

</body>
</html>
```
